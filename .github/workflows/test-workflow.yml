name: Test workflow
on:
  push:
    branches:
      - master
    paths:
      - 'templates/http-service/**'

jobs:
  test-job:
    name: Test job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Mark as safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Output actor
        run: |
          echo "🌍 Actor: ${GIT_ACTOR}"
        env:
          GIT_ACTOR: "${{ github.actor }}"
